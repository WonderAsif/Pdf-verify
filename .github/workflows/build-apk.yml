name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Boilerplate
        run: flutter create --org com.example.pdfstamp . --platforms android

      - name: Inject Chaquopy Gradle Configuration
        run: |
          cat << 'EOF' > patch_gradle.py
          import os

          settings_path = "android/settings.gradle.kts"
          with open(settings_path, "r") as f:
              settings = f.read()

          # 1. Add Maven Repo
          settings = settings.replace("mavenCentral()", "mavenCentral()\n        maven { url = uri(\"https://chaquo.com/maven\") }")

          # 2. Add Resolution Strategy to map the plugin correctly
          strategy = """
              resolutionStrategy {
                  eachPlugin {
                      if (requested.id.id == "com.chaquo.python") {
                          useModule("com.chaquo.python:gradle:${requested.version}")
                      }
                  }
              }
          """
          settings = settings.replace("pluginManagement {", "pluginManagement {" + strategy)
          
          # 3. Register Plugin (FIX: 14.0.2 is the correct, existing version)
          settings = settings.replace("id(\"dev.flutter.flutter-plugin-loader\") version \"1.0.0\"", "id(\"dev.flutter.flutter-plugin-loader\") version \"1.0.0\"\n    id(\"com.chaquo.python\") version \"14.0.2\" apply false")

          with open(settings_path, "w") as f:
              f.write(settings)

          app_build_path = "android/app/build.gradle.kts"
          with open(app_build_path, "r") as f:
              app_build = f.read()

          # 4. Apply Plugin to App & Set NDK Filters
          app_build = app_build.replace("id(\"dev.flutter.flutter-gradle-plugin\")", "id(\"dev.flutter.flutter-gradle-plugin\")\n    id(\"com.chaquo.python\")")
          app_build = app_build.replace("defaultConfig {", "defaultConfig {\n        ndk { abiFilters += setOf(\"armeabi-v7a\", \"arm64-v8a\", \"x86_64\") }")

          # 5. Append Python Build Rules
          app_build += """
          chaquopy {
              defaultConfig {
                  buildPython("python3")
                  pip {
                      install("pypdf")
                  }
              }
          }
          """
          with open(app_build_path, "w") as f:
              f.write(app_build)
          EOF
          
          # Execute the patcher
          python3 patch_gradle.py

      - name: Patch SDK Versions for file_picker
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts || true
          find /home/runner/.pub-cache/hosted/pub.dev/ -name "build.gradle" -exec sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' {} +
          find /home/runner/.pub-cache/hosted/pub.dev/ -name "build.gradle" -exec sed -i 's/compileSdk [0-9]*/compileSdk 36/g' {} +

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
