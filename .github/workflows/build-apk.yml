name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          openjdk-17-jdk \
          unzip \
          zip \
          git \
          build-essential \
          ccache \
          cmake \
          libffi-dev \
          libssl-dev \
          autoconf \
          automake \
          libtool \
          pkg-config \
          zlib1g-dev \
          wget \
          python3-dev

    - name: Setup Android SDK
      run: |
        SDK_DIR="$HOME/android-sdk"
        mkdir -p "$SDK_DIR/cmdline-tools"
        
        # Download command line tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdtools.zip
        unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
        mv /tmp/cmdtools/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
        
        # Accept licenses
        yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses || true
        
        # Install SDK components
        "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-33" "build-tools;33.0.0"
        
        # Set environment
        echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
        echo "$SDK_DIR/platform-tools" >> $GITHUB_PATH

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer==1.5.0 cython==0.29.36

    - name: Build APK
      run: |
        buildozer android debug
      env:
        BUILDOZER_WARN_ON_ROOT: 1

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: pdf-stamper-apk
        path: bin/*.apk
        retention-days: 30
        
