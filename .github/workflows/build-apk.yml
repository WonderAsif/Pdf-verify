name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Boilerplate
        run: flutter create --org com.example.pdfstamp . --platforms android

      - name: Inject Code and Permissions
        run: |
          cat << 'EOF' > patch.py
          import os
          import glob

          def patch_file(path, old, new):
              if os.path.exists(path):
                  with open(path, "r") as f:
                      content = f.read()
                  with open(path, "w") as f:
                      f.write(content.replace(old, new))

          patch_file("android/settings.gradle.kts", 'id("dev.flutter.flutter-plugin-loader") version "1.0.0"', 'id("dev.flutter.flutter-plugin-loader") version "1.0.0"\n    id("com.chaquo.python") version "17.0.0" apply false')
          patch_file("android/app/build.gradle.kts", 'id("dev.flutter.flutter-gradle-plugin")', 'id("dev.flutter.flutter-gradle-plugin")\n    id("com.chaquo.python")')
          patch_file("android/app/build.gradle.kts", 'defaultConfig {', 'defaultConfig {\n        ndk { abiFilters += setOf("armeabi-v7a", "arm64-v8a", "x86_64") }')
          
          with open("android/app/build.gradle.kts", "a") as f:
              f.write('\nchaquopy {\n    defaultConfig {\n        buildPython("python3")\n        pip {\n            install("pypdf")\n        }\n    }\n}\n')

          perms = '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n<application'
          patch_file("android/app/src/main/AndroidManifest.xml", '<application', perms)

          # FIX: Loop through ALL found MainActivity files to guarantee the active one gets patched
          for path in glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True):
              with open(path, "r") as f:
                  pkg = f.read().splitlines()[0]
              
              code = pkg + '\n\n' + \
                     'import com.chaquo.python.Python\n' + \
                     'import com.chaquo.python.android.AndroidPlatform\n' + \
                     'import io.flutter.embedding.android.FlutterActivity\n' + \
                     'import io.flutter.embedding.engine.FlutterEngine\n' + \
                     'import io.flutter.plugin.common.MethodChannel\n\n' + \
                     'class MainActivity: FlutterActivity() {\n' + \
                     '    private val CHANNEL = "com.example.pdfstamp/python"\n\n' + \
                     '    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {\n' + \
                     '        super.configureFlutterEngine(flutterEngine)\n' + \
                     '        if (!Python.isStarted()) {\n' + \
                     '            Python.start(AndroidPlatform(this))\n' + \
                     '        }\n' + \
                     '        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->\n' + \
                     '            if (call.method == "stampPdf") {\n' + \
                     '                val inputBytes = call.argument<ByteArray>("pdfBytes")\n' + \
                     '                val password = call.argument<String>("password") ?: ""\n' + \
                     '                try {\n' + \
                     '                    val py = Python.getInstance()\n' + \
                     '                    val module = py.getModule("stamper")\n' + \
                     '                    val resultBytes = module.callAttr("flawless_exact_tick_injection", inputBytes, password).toJava(ByteArray::class.java)\n' + \
                     '                    if (resultBytes != null) {\n' + \
                     '                        result.success(resultBytes)\n' + \
                     '                    } else {\n' + \
                     '                        result.error("NO_SIGNATURE", "No signature field found.", null)\n' + \
                     '                    }\n' + \
                     '                } catch (e: Exception) {\n' + \
                     '                    result.error("PYTHON_ERROR", e.message, null)\n' + \
                     '                }\n' + \
                     '            } else {\n' + \
                     '                result.notImplemented()\n' + \
                     '            }\n' + \
                     '        }\n' + \
                     '    }\n' + \
                     '}\n'
              
              with open(path, "w") as f:
                  f.write(code)
          EOF
          
          python3 patch.py

      - name: Patch SDK Versions for Plugins
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts || true
          find /home/runner/.pub-cache/hosted/pub.dev/ -name "build.gradle" -exec sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' {} +
          find /home/runner/.pub-cache/hosted/pub.dev/ -name "build.gradle" -exec sed -i 's/compileSdk [0-9]*/compileSdk 36/g' {} +

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
