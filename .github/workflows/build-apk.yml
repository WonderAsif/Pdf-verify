name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk build-essential ccache git wget unzip
        pip install buildozer==1.5.0 cython==0.29.36

    - name: Setup Android SDK
      run: |
        SDK_DIR="$HOME/android-sdk"
        mkdir -p "$SDK_DIR/cmdline-tools"
        
        # Download command line tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdtools.zip
        unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
        mv /tmp/cmdtools/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
        
        # Create licenses directory and accept all licenses
        mkdir -p "$SDK_DIR/licenses"
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_DIR/licenses/android-sdk-license"
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > "$SDK_DIR/licenses/android-sdk-preview-license"
        
        # Accept licenses non-interactively
        yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
        
        # Install specific build-tools version
        "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
        
        # Verify aidl exists
        ls -la "$SDK_DIR/build-tools/33.0.2/aidl" || echo "aidl not found!"
        
        # Set environment
        echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
        echo "$SDK_DIR/platform-tools" >> $GITHUB_PATH
        echo "$SDK_DIR/build-tools/33.0.2" >> $GITHUB_PATH

    - name: Build APK
      run: buildozer android debug
      env:
        BUILDOZER_WARN_ON_ROOT: 1
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: pdf-stamper-apk
        path: bin/*.apk
        retention-days: 30
        
